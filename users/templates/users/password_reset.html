{% extends 'myapp/base.html' %}

{% block body %}
<div class="min-h-[calc(100vh-200px)] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm bg-white rounded-lg shadow-md p-8">
        <div class="text-center mb-6">
            <div class="w-12 h-12 mx-auto rounded-full bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/30 mb-4">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Reset your password</h1>
            <p class="text-sm text-slate-500 mt-1">Enter your email and we'll send you a link to reset it.</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}

            {% if messages %}
                {% for message in messages %}
                    <div class="px-3 py-2 rounded text-sm
                                {% if message.tags == 'success' %}bg-green-100 border border-green-400 text-green-800
                                {% elif message.tags == 'error' %}bg-red-100 border border-red-400 text-red-800
                                {% else %}bg-blue-100 border border-blue-400 text-blue-800{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">
                    Email Address
                </label>
                <input type="email"
                       name="email"
                       id="email"
                       required
                       placeholder="your@email.com"
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>

            <button type="submit"
                    class="w-full py-2.5 rounded bg-blue-600 hover:bg-blue-700 text-white font-semibold transition-colors">
                Send Reset Link
            </button>
        </form>

        <p class="text-center text-sm text-slate-600 mt-6">
            Remembered it?
            <a href="{% url 'users:login' %}" class="text-blue-600 hover:underline font-medium">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
