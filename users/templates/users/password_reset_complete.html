{% extends 'myapp/base.html' %}

{% block body %}
<div class="min-h-[calc(100vh-200px)] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8 text-center">

        <!-- Success Icon -->
        <div class="w-16 h-16 mx-auto rounded-full bg-gradient-to-br from-emerald-400 to-green-600 flex items-center justify-center shadow-lg shadow-emerald-500/30 mb-5">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
        </div>

        <!-- Heading -->
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Password updated</h1>
        <p class="text-sm text-slate-500 leading-relaxed mb-6">
            Your password has been changed successfully.
            You can now log in with your new password.
        </p>

        <!-- Info Box -->
        <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-4 mb-6 text-left">
            <div class="flex gap-3">
                <svg class="w-5 h-5 text-emerald-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
                <div class="text-xs text-emerald-800 leading-relaxed">
                    <p class="font-semibold mb-1">Security tip</p>
                    <p>For your safety, all other sessions have been signed out. Log in again to continue.</p>
                </div>
            </div>
        </div>

        <!-- Primary Action -->
        <a href="{% url 'users:login' %}"
           class="block w-full py-2.5 rounded bg-blue-600 hover:bg-blue-700 text-white font-semibold transition-colors">
            Continue to Login
        </a>

    </div>
</div>
{% endblock %}
