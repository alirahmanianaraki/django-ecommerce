{% extends 'myapp/base.html' %}
{% block body %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8 text-center">
        <div class="w-16 h-16 mx-auto rounded-full bg-amber-100 flex items-center justify-center mb-4">
            <svg class="w-8 h-8 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Payment cancelled</h1>
        <p class="text-sm text-slate-500 mb-6">
            Your order is saved but unpaid. You can retry payment from your order page anytime.
        </p>
        <a href="{% url 'orders:order_list' %}"
           class="inline-block px-6 py-2.5 rounded bg-blue-600 hover:bg-blue-700 text-white font-semibold">
            View my orders
        </a>
    </div>
</div>
{% endblock %}
