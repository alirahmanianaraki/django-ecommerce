{% extends 'myapp/base.html' %}
{% block body %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8 text-center">
        <div class="w-16 h-16 mx-auto rounded-full bg-green-100 flex items-center justify-center mb-4">
            <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Payment received</h1>
        <p class="text-sm text-slate-500 mb-6">
            Thanks! Your order is being processed. You'll receive a confirmation email shortly.
        </p>
        {% if order %}
            <a href="{% url 'orders:order_detail' order.pk %}"
               class="inline-block px-6 py-2.5 rounded bg-blue-600 hover:bg-blue-700 text-white font-semibold">
                View order #{{ order.pk }}
            </a>
        {% else %}
            <a href="{% url 'myapp:index' %}"
               class="inline-block px-6 py-2.5 rounded bg-blue-600 hover:bg-blue-700 text-white font-semibold">
                Continue shopping
            </a>
        {% endif %}
    </div>
</div>
{% endblock %}
